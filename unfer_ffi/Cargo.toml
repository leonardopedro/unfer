[package]
name = "unfer_ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Handle-based C ABI for the unfer probability kernel."

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
latex = ["prob_kernel/latex"]
cuda = ["prob_kernel/cuda"]
zenodo = ["dep:ureq"]
sqlite = ["dep:rusqlite"]

[dependencies]
prob_kernel = { path = "../prob_kernel" }
unfer_protocol = { path = "../unfer_protocol" }
unfer_data = { path = "../unfer_data" }
unfer_consensus = { path = "../unfer_consensus" }
ode_sirk = { path = "../ode_sirk" }
serde = { workspace = true }
serde_json = { workspace = true }
hex = "0.4"
loro = { workspace = true }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
ureq = { version = "2", features = ["json"], optional = true }

[dev-dependencies]
proptest = { workspace = true }
