[package]
name = "fock_sirk"
version = "0.1.0"
edition = "2024"
description = "High-performance Shift-Invert Rational Krylov solver for Fock spaces."

[features]
# CPU-only by default so the workspace builds and tests without a CUDA toolkit.
# Enable GPU offload with: cargo build -p fock_sirk --features cuda
default = []
cuda = ["candle-core/cuda"]
# G18: run one Austral-authored kernel (australVM's `examples/gpu/unfer-scale`)
# over the solver's amplitude scale. The dependency is the isolated GPU crate,
# which has no unfer/JIT dependency, so there is no cycle; it stays optional so
# the default build and the solver are untouched.
austral-gpu = ["dep:avm-gpu"]

[dependencies]
nested_fock_algebra = { path = "../nested_fock_algebra", features = ["latex"] }
num-complex = { workspace = true }
nalgebra = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
# `float_roundtrip` keeps checked-fixture parameters bit-identical when parsed.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = "0.10"
rustc-hash = { workspace = true }

candle-core = { workspace = true }
quantrs2-symengine-pure = "0.1.3"
# G18 integration only: the bundle checker/runner, with its device path.
avm-gpu = { path = "../../australVM/safestos/gpu", features = ["device"], optional = true }

[dev-dependencies]
criterion = "0.5"
# M5: property tests for the pure mass-gap functions (mass_gap_properties.rs).
proptest = { workspace = true }
# M5: Kani harnesses for the same pure core (src/mass_gap_kani.rs). No
# `kani` dependency here: the crate is not on crates.io (the name there is a
# placeholder) — `cargo kani` injects its own library from ~/.kani. The module
# is `#[cfg(kani)]`-gated, so ordinary `cargo test` compiles an empty module
# and the suite counts do not move.

# G18: the Austral-kernel example is excluded from the default build (and from
# `--all-targets` without the feature) by `required-features`.
[[example]]
name = "austral_pointwise"
required-features = ["austral-gpu"]

[[bench]]
name = "sirk"
harness = false

# CUDA bench (P8 P10). Gated on the `cuda` feature; the bench file
# itself is `#[cfg(feature = "cuda")]` so the CPU build doesn't try
# to compile it.
[[bench]]
name = "sirk_cuda"
harness = false
required-features = ["cuda"]

# `cfg(kani)` is set only by `cargo kani`. Register it so rustc's
# unexpected-cfg lint — enforced as `-D warnings` by CI — accepts the
# `#[cfg(kani)]` gates in src/lib.rs and src/mass_gap_kani.rs.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
