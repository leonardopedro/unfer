  # ---------------------------------------------------------------------------
  # Zenodo store module gate: type-check + authorization test.
  # The full JIT-execution positive test is blocked by a pre-existing CPS-JIT
  # crash (tracks Plan B / australVM issue). Type-check passes cleanly.
  # ---------------------------------------------------------------------------
  zenodo-e2e:
    name: zenodo_store_module type-check + auth gate
    runs-on: ubuntu-latest
    steps:
      - name: checkout unfer (sibling layout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          path: unfer
      - name: checkout australVM (sibling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          repository: leonardopedro/australVM
          path: australVM
      - name: checkout dynamic-arctic (sibling path dep, unfer_consensus)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          repository: leonardopedro/dynamic-arctic
          # Explicit path: without it the checkout targets (and cleans) the
          # workspace root, wiping the unfer/australVM sibling checkouts.
          path: dynamic-arctic
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # Swatinem/rust-cache@v2
        with:
          workspaces: |
            unfer
            australVM/safestos/cranelift
      - uses: ocaml/setup-ocaml@e89b2ded52a6e13f50162220cf5fe47290162032  # ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.13"
      - name: install australVM OCaml deps
        working-directory: australVM
        run: opam install . --deps-only --yes || true
      - name: type-check zenodo_store_module
        working-directory: unfer
        run: bash tools/module_builder tc zenodo_store_module
      - name: auth gate test (uz_push allow + deny)
        working-directory: unfer
        run: |
          MODHOST="../australVM/safestos/cranelift/target/release/modhost"
          # Allow: full manifest grants uz_push
          $MODHOST authorize zenodo_store_module/module.toml zenodo_store_module uz_push
          # Deny: strip uz_push → UK-4001
          STRIPPED=$(mktemp)
          trap 'rm -f "$STRIPPED"' EXIT
          grep -v uz_push zenodo_store_module/module.toml > "$STRIPPED"
          if $MODHOST authorize "$STRIPPED" zenodo_store_module uz_push 2>/dev/null; then
            echo "FAIL: stripped manifest must DENY uz_push" >&2; exit 1
          fi
          echo "PASS: auth gate enforces uz_push grant"

  # ---------------------------------------------------------------------------
  # CUDA-on-CI: GPU smoke for the SIRK solver. The 14 CUDA tests in
  # fock_sirk/src/forward_sirk.rs are smoke-tested locally but not in CI.
  # CUDA smoke: runs only when a self-hosted runner with the `gpu` label is
  # registered AND the RUN_CUDA_SMOKE repository variable is set to `true`
  # (Settings → Secrets and variables → Actions → Variables). Without the
  # variable the job is *skipped*, so runs complete — a bare runner-gated job
  # would sit in `queued` forever and hold every CI run hostage. Mirrors
  # qfm-tomo-e2e but enables the `cuda` feature for fock_sirk.
  # ---------------------------------------------------------------------------
  qfm-tomo-e2e-cuda:
    if: vars.RUN_CUDA_SMOKE == 'true'
    name: fock_sirk CUDA smoke (self-hosted GPU)
    runs-on: [self-hosted, gpu]
    steps:
      - name: checkout unfer (sibling layout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          path: unfer
      # unfer is at $GITHUB_WORKSPACE/unfer (path layout), so the
      # ../../dynamic-arctic path dep resolves to $GITHUB_WORKSPACE/dynamic-arctic.
      - name: checkout dynamic-arctic (sibling path dep, unfer_consensus)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          repository: leonardopedro/dynamic-arctic
          # Explicit path: without it the checkout targets (and cleans) the
          # workspace root, wiping the unfer/australVM sibling checkouts.
          path: dynamic-arctic
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # Swatinem/rust-cache@v2
        with:
          workspaces: |
            unfer
      - name: print GPU info
        run: |
          nvidia-smi
      - name: cargo test (cuda)
        working-directory: unfer
        # On systems with CUDA 12.2 toolkit + CUDA 13 driver coexistence
        # the runtime resolves to /lib/x86_64-linux-gnu; AGENTS.md §5
        # records the LD_LIBRARY_PATH requirement.
        env:
          LD_LIBRARY_PATH: /lib/x86_64-linux-gnu:/usr/lib/x86_64-linux-gnu
        run: cargo test -p fock_sirk --features cuda -- --nocapture
