name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # CPU-only: the `cuda` feature is never enabled in CI. All acceptance
  # criteria in docs/IMPLEMENTATION_PLAN.md run on CPU.

jobs:
  # ---------------------------------------------------------------------------
  # H1 (PLAN_HARNESS): maintenance-invariant gate. Turns the AGENTS.md
  # maintenance checklist into machine-checkable invariants. Passes on a clean
  # tree with the toolchain present, fails on a deliberately introduced
  # violation.
  #
  # Toolchain is required, not optional: smoke_gate builds libunfer_ffi.so and
  # the H11 coverage gate runs the unit harness under -C instrument-coverage,
  # so the job installs stable + llvm-tools-preview. Without the toolchain the
  # gates would print [gap] (tooling absent) and never actually enforce — the
  # job would be green while the checks it claims to run did nothing.
  # ---------------------------------------------------------------------------
  verify-invariants:
    name: maintenance invariants (H1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
      # unfer_consensus path-deps ../../dynamic-arctic; default checkout puts
      # the repo at $GITHUB_WORKSPACE, so the sibling must sit one level up.
      - name: checkout dynamic-arctic as sibling (unfer_consensus path dep)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/dynamic-arctic.git ../dynamic-arctic
      # A6: smoke_gate's smokes 2-3 exercise binaries that live in *sibling*
      # repos (`unfer_agent` in velysterm, `modhost` in australVM). Without the
      # siblings they print [gap] ("tooling absent") and the job stayed green
      # while two of the three real entry paths were not covered. Clone the
      # siblings and build the two binaries so the smokes run for real — the
      # goal is not "no [gap]" but coverage; a missing binary after these build
      # steps is a hard [FAIL] inside smoke_gate itself.
      - name: checkout velysterm + australVM as siblings (smoke_gate smokes 2-3)
        run: |
          git clone --depth 1 --branch main https://github.com/leonardopedro/velysterm.git ../velysterm
          git clone --depth 1 --branch main https://github.com/leonardopedro/australVM.git ../australVM
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # dtolnay/rust-toolchain@stable
      - name: install LLVM coverage tools (H11 per-file coverage gate)
        run: rustup component add llvm-tools-preview
      - name: build the sibling binaries smoke_gate exercises
        run: |
          cargo build --locked --manifest-path ../velysterm/Cargo.toml -p kernel_client --bin unfer_agent
          cargo build --locked --manifest-path ../australVM/safestos/cranelift/Cargo.toml \
            --no-default-features --features unfer-kernel --bin modhost
      - name: run scripts/verify-invariants
        run: bash scripts/verify-invariants

  # ---------------------------------------------------------------------------
  # X1/X5 hygiene gates. Cheap, and they catch the class of drift that is
  # invisible in review: a generated file committed before its ignore rule
  # existed, and the shared LaTeX corpus diverging between the two repos that
  # hold a copy.
  #
  # timepiece is checked out as a sibling because `scripts/check-book-sync`
  # needs both sides to compare. It is the source of record for book.tex and
  # ODE.tex; unfer/ carries a synced copy because its tests read it by that path.
  # ---------------------------------------------------------------------------
  hygiene-gates:
    name: artifact + corpus drift gates (X1/X5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
      - name: checkout timepiece as sibling (shared LaTeX source of record)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/timepiece.git ../timepiece
      - name: no tracked build artifacts (X5)
        run: bash scripts/tree-size
      - name: book.tex / ODE.tex in sync (X1)
        run: bash scripts/check-book-sync
      - name: status blocks present and sane (X2)
        run: bash scripts/check-status
      # X9: every adaptation claim ("adapted from", "inspired by", "ported
      # from", ...) in the trees must resolve to an ATTRIBUTION.md ledger row
      # or an internal cross-reference. In CI this is the narrow shape: this
      # checkout, its own ledger -- the workspace root here holds siblings,
      # not the root ledger, so resolution must succeed from unfer's own rows.
      - name: attribution ledger (X9)
        run: bash scripts/check-attribution
      # M9: the truncated-vs-continuum and gauge-fixed-vs-lattice boundaries are
      # prose, so nothing checks them by default and a future edit can upgrade a
      # truncated claim to a continuum one silently. Narrow by design: it caught a
      # planted overclaim and produced no false positives across the corpus.
      - name: no boundary overclaim in status prose (M9)
        run: bash scripts/check-non-claims
      # M3: the two MASS_GAP_SPEC.md copies legitimately differ (the timepiece
      # bundle is self-contained: rewritten .cdb paths plus its own preamble), so
      # this checks operative parity rather than bytes. It was already drifted
      # when written; the differences turned out to be the declared ones.
      - name: MASS_GAP_SPEC.md operative parity (M3)
        run: bash scripts/check-mass-gap-spec-parity
      # M4: §4's table is the contract pinning each claim to a named test, and
      # both directions had gone stale by hand only -- row 7 named a function
      # that had been renamed. Both copies of the spec are checked, bundle
      # included, because the specialist reads that copy.
      - name: MASS_GAP_SPEC.md §4 rows ↔ suite tests bijection (M4)
        run: bash scripts/check-mass-gap-claims

  # ---------------------------------------------------------------------------
  # X7: cross-repo integration.
  #
  # Every repo in this workspace passes its own CI against its own checkout, and
  # three of them depend on a *sibling's* working tree: unfer path-deps
  # dynamic-arctic and velysterm. A change in one that breaks another is
  # invisible until someone runs the pair locally, which is exactly the failure
  # mode a path dependency invites.
  #
  # Each repo runs as its own step with `if: always()` so nothing is skipped by
  # an earlier failure, and a final step reports which repo broke which by name.
  # That summary is the acceptance criterion: a deliberate break in prob_kernel
  # has to show up as a *named* failure, not a red blob.
  #
  # The commands are the ones each README's Verification section documents, so
  # there is one answer to "how do I check this repo" rather than two.
  # ---------------------------------------------------------------------------
  cross-repo:
    name: cross-repo integration (X7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # Swatinem/rust-cache@v2

      # ---------------------------------------------------------------------
      # Sibling pins (X7).
      #
      # Every sibling is checked out at an explicitly named ref rather than at
      # whatever the remote's default branch happens to be. Branch names are
      # legal values here; a 40-character commit SHA is the stronger choice and
      # is what makes a red run reproducible months later.
      #
      # These are `main` because that is what has been observed to exist on the
      # remotes. They are NOT invented SHAs: pinning to a commit that was never
      # pushed would break every run of this job, which is a worse outcome than
      # tracking a branch. To pin, replace the value with a real SHA from
      # `git ls-remote <url> refs/heads/main` and commit that; the resolved SHA
      # is echoed by the report step below either way, so a failure always names
      # the exact commit it saw.
      # ---------------------------------------------------------------------
      - name: checkout siblings at pinned refs
        env:
          DYNAMIC_ARCTIC_REF: main
          VELYSTERM_REF: main
          AUSTRALVM_REF: main
          EMTHIN_REF: main
        run: |
          set -euo pipefail
          clone() {
            local url="$1" ref="$2" dest="$3"
            git clone --depth 1 --branch "$ref" "$url" "$dest"
            echo "  $dest @ $(git -C "$dest" rev-parse HEAD)"
          }
          clone https://github.com/leonardopedro/dynamic-arctic.git "$DYNAMIC_ARCTIC_REF" ../dynamic-arctic
          clone https://github.com/leonardopedro/velysterm.git       "$VELYSTERM_REF"       ../velysterm
          clone https://github.com/leonardopedro/australVM.git        "$AUSTRALVM_REF"       ../australVM

      # emthin is cloned separately and best-effort. Two reasons, both honest:
      #   * its remote URL was inferred from the sibling naming convention and
      #     has never been confirmed by a successful run, and
      #   * its build needs a system dependency set that has never been
      #     exercised on a runner.
      # So a failure here must not take down the four steps that are known
      # good. It is reported as its own verdict — SKIP, meaning "not covered",
      # never PASS — because a gate that silently stops covering something is
      # how a gap becomes invisible.
      - name: checkout emthin at pinned ref (best effort)
        env:
          EMTHIN_REF: main
        run: |
          git clone --depth 1 --branch "$EMTHIN_REF" \
            https://github.com/leonardopedro/emthin.git ../emthin \
            && echo "  ../emthin @ $(git -C ../emthin rev-parse HEAD)" \
            || echo "  NOTE: emthin checkout failed; the emthin step will report SKIP"

      # velysterm's document crates are Bevy-free but not dependency-free:
      # winit/xkbcommon and the X/wayland client libs are found through
      # pkg-config. Installing them explicitly is the difference between a gate
      # that tests the workspace and one that reliably reports a missing -l flags.
      - name: system deps for the velysterm crates
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb1-dev libxcb-shm0-dev libxcb-render0-dev

      # emthin's own build needs more than the document crates do:
      # `emthin-dbus` -> gio -> glib-sys locates glib with pkg-config at
      # build-script time, calloop's libudev-sys needs udev's `.pc` (which comes
      # from systemd, not from a `libudev` package), smithay's wayland frontend
      # links libxkbcommon and libinput directly, and the gbm renderer needs mesa.
      # See `emthin/docs/build-notes.md`, which documents this set.
      - name: system deps for emthin
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            pkg-config libglib2.0-dev libudev-dev libinput-dev libseat-dev \
            libgbm-dev libdrm-dev libegl1-mesa-dev libgles2-mesa-dev \
            wayland-protocols libexpat1-dev

      # australVM's OCaml half needs a compiler before `make test` can run. The
      # dependency install is `|| true` for the same reason the module e2e jobs
      # do it: a transient opam mirror failure should not read as a code break,
      # and the step that actually proves something is the one that runs the
      # suite. `make test` (X4b) picks the dynamic loader itself.
      - uses: ocaml/setup-ocaml@e89b2ded52a6e13f50162220cf5fe47290162032  # ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.13"
      - name: install australVM OCaml deps
        working-directory: ../australVM
        run: opam install . --deps-only --yes || true

      # Layout note, because it is load-bearing and invisible: the siblings land
      # in $GITHUB_WORKSPACE/../<repo>, which is what makes velysterm's
      # `../../../unfer` path dependency resolve back to this checkout. That works
      # because Actions checks out into a directory named after the repo. Moving
      # the clones elsewhere would break the path dep with a confusing error, so
      # the paths above are deliberate.
      #
      # The coupling this job exists to catch is real in both directions:
      # unfer_consensus path-deps dynamic-arctic, mathed_mini path-deps
      # unfer_ffi and unfer_protocol, and australVM's JIT bridge path-deps five
      # unfer crates plus dynamic-arctic. A green unfer run says nothing about
      # whether any of them still fits.

      # The path-dependency hazard, called out explicitly: this job exists because
      # `unfer_consensus` and `mathed_core` compile against a sibling checkout, so
      # unfer's own green run says nothing about whether the sibling still fits.
      - name: unfer (kernel + dynamic-arctic path dep)
        id: unfer
        run: cargo build --locked --workspace

      - name: dynamic-arctic (threshold authority)
        id: arctic
        run: |
          cargo build --locked --manifest-path ../dynamic-arctic/Cargo.toml --no-default-features
          cargo test  --locked --manifest-path ../dynamic-arctic/Cargo.toml --no-default-features

      - name: velysterm (document engine emthin path-deps)
        id: velysterm
        run: |
          cargo test --locked --manifest-path ../velysterm/Cargo.toml \
            -p mathed_core -p mathed_mini

      # australVM, in two steps because the coupling is in two languages.
      #
      # The Rust step is the one that matters most: safestos/cranelift is the
      # most tightly path-depended crate in the workspace -- unfer_ffi,
      # unfer_protocol, unfer_consensus, unfer_identity, unfer_data *and*
      # dynamic-arctic, with unfer-kernel on by default -- and until now nothing
      # in this job compiled it, so a prob_kernel change that broke the JIT
      # bridge surfaced only in the six per-module e2e jobs, with no indication
      # which repo had broken which.
      - name: "australVM (JIT bridge: five unfer path deps + dynamic-arctic)"
        id: australvm-rs
        run: |
          cargo test --locked --manifest-path ../australVM/safestos/cranelift/Cargo.toml

      # The OCaml half: the plugin/Why3-gate suite, through the X4b wrapper so
      # the bridge .so is loaded by a loader that can actually load it.
      - name: australVM (OCaml plugin + Why3 gate suites)
        id: australvm-ocaml
        run: make -C ../australVM test

      # emthin was, until 2026-10-05, built by nothing — it has no CI of its own
      # (no `.github/`), and it path-deps velysterm's mathed_core and
      # mathed_mini, so a velysterm change could break it invisibly. `cargo check`
      # rather than `cargo build`: the point is that the crate graph still
      # resolves against its siblings, which is the coupling X7 exists to catch,
      # and linking smithay would buy nothing for that.
      #
      # HONESTY BOUNDARY: this step has never been observed green. The system
      # dependency list above is transcribed from `emthin/docs/build-notes.md`
      # and `emthin/flake.nix`, not from a run — the machine this was authored on
      # has no pkg-config and cannot build emthin at all. Treat the first run as
      # a hypothesis about the dependency list, not as a passing gate.
      - name: "emthin (compositor: velysterm mathed_core/mathed_mini path deps)"
        id: emthin
        run: |
          if [ ! -f ../emthin/Cargo.toml ]; then
            echo "::warning::emthin was not checked out; this job says nothing about whether it still builds against velysterm"
            exit 0
          fi
          cargo check --locked --manifest-path ../emthin/Cargo.toml -p emthin

      # `if: always()`: one broken repo must not hide the state of the others.
      - name: report which repo broke which
        if: always()
        run: |
          # The resolved commit of every sibling, so a failure is attributable to
          # an exact tree rather than to "velysterm, sometime".
          echo "sibling commits:"
          for d in ../dynamic-arctic ../velysterm ../australVM ../emthin; do
            [ -d "$d/.git" ] && echo "  $(basename "$d") $(git -C "$d" rev-parse HEAD)"
          done
          echo
          # Each step records a conclusion either way, so this step runs even when
          # the steps above were skipped by an earlier failure.
          #
          # `not covered` is derived from whether the repo is actually present,
          # not from the step's exit code: the emthin step deliberately exits 0
          # when it could not check the repo out, so trusting the outcome alone
          # would print PASS for a repo nothing was checked against.
          failed=""
          skipped=""
          for step in unfer arctic velysterm australvm-rs australvm-ocaml emthin; do
            if [ "$step" = "emthin" ] && [ ! -f ../emthin/Cargo.toml ]; then
              echo "  SKIP  $step (not covered: repo not checked out)"
              skipped="$skipped $step"
              continue
            fi
            case "${{ steps.$step.outcome }}" in
              success) echo "  PASS  $step" ;;
              skipped) echo "  SKIP  $step (step did not run)" ; skipped="$skipped $step" ;;
              *)       echo "  FAIL  $step (${{ steps.$step.outcome }})" ; failed="$failed $step" ;;
            esac
          done
          if [ -n "$failed" ]; then
            echo
            echo "cross-repo: broken repo(s):$failed"
            echo "  A dynamic-arctic failure here is usually an API drift in the"
            echo "  threshold signatures that unfer_consensus depends on."
            echo "  A velysterm failure here is usually a document-model change"
            echo "  that emthin and unfer both consume."
            echo "  An emthin failure is usually a velysterm document-model change"
            echo "  (it path-deps mathed_core and mathed_mini), or a missing system"
            echo "  library -- see emthin/docs/build-notes.md."
            echo "  An australvm-rs failure here is usually a uk_* symbol or C"
            echo "  ABI change: the bridge registers against unfer_protocol's"
            echo "  SYMBOL_REGISTRY and path-deps five unfer crates."
            echo "  An australvm-ocaml failure is usually a plugin pass or a"
            echo "  missing loader; run 'make -C australVM loader' to diagnose."
            exit 1
          fi
          echo "cross-repo: all sibling repos verified"
          if [ -n "$skipped" ]; then
            echo
            echo "cross-repo: NOT COVERED:$skipped"
            echo "  A SKIP is not a PASS. These repos are outside this job's"
            echo "  reach right now, and nothing here should be read as evidence"
            echo "  that they still build."
          fi

  # ---------------------------------------------------------------------------
  # Core: the unfer kernel workspace must build, lint and test on CPU.
  # This locks in the per-crate baselines recorded in IMPLEMENTATION_PLAN.md.
  # ---------------------------------------------------------------------------
  test:
    name: workspace test (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
      # unfer_consensus path-deps ../../dynamic-arctic; default checkout puts
      # the repo at $GITHUB_WORKSPACE, so the sibling must sit one level up.
      - name: checkout dynamic-arctic as sibling (unfer_consensus path dep)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/dynamic-arctic.git ../dynamic-arctic
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # Swatinem/rust-cache@v2
      - name: cargo build
        run: cargo build --locked --workspace --release --verbose
      # Heavy tests run in release mode (per policy) with the numerically
      # optimized profile (lto=thin, codegen-units=1). Debug mode is reserved
      # for the fast unit suites; the physics/SIRK suites are release-only.
      # Split in two so the status block's count can be recounted from the run
      # CI already performs (X2 drift half): the workspace proper is teed and
      # handed to `check-status --recount`, and `fock_sirk` — cited separately
      # in the README as an external physics dependency — runs as its own step.
      # Together they cover exactly what the single `--workspace --release`
      # step this replaced did, with no extra build and no extra suite run.
      #
      # `pipefail` matters: without it a failing suite would exit 0 through
      # `tee` and the step would look green. A failed suite also stops before
      # the recount, which is right — a broken run cannot evidence a count.
      - name: cargo test (release, workspace excluding fock_sirk)
        run: |
          set -o pipefail
          cargo test --locked --workspace --release --exclude fock_sirk --verbose 2>&1 | tee /tmp/unfer_tests.log
          bash scripts/check-status --recount unfer=/tmp/unfer_tests.log
      - name: cargo test (release, fock_sirk)
        run: cargo test --locked -p fock_sirk --release --verbose
      # The heavy nested_fock_algebra physics unit tests (e.g. the quartic QYM
      # builder) are #[ignore]d so the debug default suite stays fast; they run
      # here in release via --ignored (0.01s each) — same mode as
      # scripts/run_heavy_tests.sh.
      - name: heavy physics unit tests (release, ignored)
        run: cargo test --locked -p nested_fock_algebra --release --lib -- --ignored
      # F23 (S24): the release manifest is byte-addressed and pinned; a wrong byte in
      # any module changes the manifest and fails this explicit golden gate. Regenerate a
      # deliberately-changed manifest only with UPDATE_GOLDEN=1 (never in CI).
      - name: release manifest golden gate (F23)
        run: cargo test --locked -p unfer_data --test release_manifest_golden

      # D6 / D-C6: the pinned calibration report must match a fresh run.
      #
      # This is a golden gate in the same sense as the manifest above, and for
      # the same reason: the report is the *only* thing that can move the engine
      # from emitting scores to emitting probabilities, so it must not be
      # editable by hand. `decide_report` exits 0 whether the contract passes or
      # fails — a failing measurement is a result, not a crash — so the gate is
      # the byte comparison, not the exit code.
      - name: decide calibration report is fresh
        run: |
          cp decide_core/tests/fixtures/decide_calibration_report.json /tmp/committed.json
          cargo run --locked -p decide_core --bin decide_report -- --write
          if ! diff -u /tmp/committed.json decide_core/tests/fixtures/decide_calibration_report.json; then
            echo "::error::decide_core calibration report drifted from a fresh run."
            echo "If the change is intended, commit the regenerated fixture with"
            echo "  cargo run -p decide_core --bin decide_report -- --write"
            echo "and state in the commit message which R-requirement verdict changed."
            exit 1
          fi

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
      # unfer_consensus path-deps ../../dynamic-arctic; default checkout puts
      # the repo at $GITHUB_WORKSPACE, so the sibling must sit one level up.
      - name: checkout dynamic-arctic as sibling (unfer_consensus path dep)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/dynamic-arctic.git ../dynamic-arctic
      # Explicit 1.97.1: rust-toolchain.toml overrides the toolchain the action
      # installs, so without the explicit pin the rustfmt/clippy components land
      # on the action's own (newer) stable and the pinned toolchain lacks them.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # A6: only default features were ever clippy'd. The gated surfaces are
      # *tested* by the gated-features job but were never linted. `pkg/feature`
      # syntax scopes each feature to the crate that defines it (bare names
      # under --workspace would be ambiguous). `cuda` stays out deliberately:
      # it is self-hosted-GPU-only (qfm-tomo-e2e-cuda) and this is every
      # non-default feature the gated-features job exercises.
      - run: >
          cargo clippy --locked --workspace --all-targets
          --features unfer_edge/audit,unfer_ffi/zenodo,unfer_ffi/latex,nested_fock_algebra/latex,prob_kernel/latex,unfer_consensus/network,unfer_taler/network
          -- -D warnings
      # A6: velysterm's rust.yml has both of these and unfer had neither —
      # a no-default-features workspace build (a feature combination the
      # default matrix never compiles) and rustdoc with warnings denied
      # (doc rot is invisible to clippy and to the test suites).
      - run: cargo check --locked --workspace --no-default-features
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # ---------------------------------------------------------------------------
  # Feature-gated jobs: the default-features matrix never compiles the
  # `network`/`audit`/`zenodo`/`latex` surfaces, so their gated tests (9 zenodo,
  # 14 audit console, latex CAS, QuePaxa network) never ran in CI. This job
  # exercises each feature's test suite. The `cuda` surface is covered by the
  # self-hosted `qfm-tomo-e2e-cuda` job (needs a CUDA toolkit + GPU, unavailable
  # on public runners).
  # ---------------------------------------------------------------------------
  gated-features:
    name: feature-gated tests (network/audit/zenodo/latex)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
      # unfer_consensus path-deps ../../dynamic-arctic; default checkout puts
      # the repo at $GITHUB_WORKSPACE, so the sibling must sit one level up.
      - name: checkout dynamic-arctic as sibling (unfer_consensus path dep)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/dynamic-arctic.git ../dynamic-arctic
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # dtolnay/rust-toolchain@stable
