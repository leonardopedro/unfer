        working-directory: unfer
        run: bash tools/module_builder tc zenodo_store_module
      - name: auth gate test (uz_push allow + deny)
        working-directory: unfer
        run: |
          MODHOST="../australVM/safestos/cranelift/target/release/modhost"
          # Allow: full manifest grants uz_push
          $MODHOST authorize zenodo_store_module/module.toml zenodo_store_module uz_push
          # Deny: strip uz_push → UK-4001
          STRIPPED=$(mktemp)
          trap 'rm -f "$STRIPPED"' EXIT
          grep -v uz_push zenodo_store_module/module.toml > "$STRIPPED"
          if $MODHOST authorize "$STRIPPED" zenodo_store_module uz_push 2>/dev/null; then
            echo "FAIL: stripped manifest must DENY uz_push" >&2; exit 1
          fi
          echo "PASS: auth gate enforces uz_push grant"

  # ---------------------------------------------------------------------------
  # A6: the three module e2e jobs that had none.
  #
  # Six modules (demo, qfm, qfm_tomo, bayes, iterated_bayes, zenodo) had e2e
  # jobs; client_module, gatekeeper_module and durable_status_module had only
  # their in-repo tests, so nothing exercised them end-to-end on CI. The pair
  # and the Austral module need different harnesses — client/gatekeeper are
  # ECMAScript-archetype modules whose positive flow + deny tests live in
  # australVM's `ecmascript_module` test binary (behind the `ecmascript`
  # feature, which *nothing* in CI enabled: cross-repo runs cranelift tests
  # with default features only), while durable_status_module is an Austral
  # module that goes through module_builder like the other six.
  # ---------------------------------------------------------------------------
  client-gatekeeper-e2e:
    name: client_module + gatekeeper_module end-to-end (workerd + UK-4001)
    runs-on: ubuntu-latest
    steps:
      - name: checkout unfer (sibling layout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          path: unfer
      - name: checkout australVM (sibling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          repository: leonardopedro/australVM
          path: australVM
      - name: checkout dynamic-arctic (sibling path dep, unfer_consensus)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          repository: leonardopedro/dynamic-arctic
          # Explicit path: without it the checkout targets (and cleans) the
          # workspace root, wiping the unfer/australVM sibling checkouts.
          path: dynamic-arctic
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # Swatinem/rust-cache@v2
        with:
          workspaces: |
            unfer
            australVM/safestos/cranelift
      # The ECMAScript backend runs each module in a workerd sidecar. The tests
      # auto-discover the runtime (UNFER_WORKERD, $PATH, fnm installs) and
      # *skip themselves* when it is absent — which is exactly how this suite
      # could be green while covering nothing. The `command -v` assertion makes
      # the install a precondition: no runtime = red, never a silent skip.
      # HONESTY: the install line is verified against the npm registry
      # (`npm view workerd` resolves) but the full suite has not been observed
      # green on a fresh runner; treat the first run as the experiment.
      - name: install the workerd sidecar runtime
        run: |
          npm install -g workerd
          command -v workerd
          # The package's postinstall moves the native binary over its Node
          # launcher. If npm blocks install scripts, bin/workerd stays the
          # launcher: ModuleHost arms SO_PEERCRED with the launcher's pid, the
          # real workerd's connection is then 403'd with a body the harness
          # maps to `undefined`, and every test fails with a cryptic
          # "reading ... of undefined" — measured locally (2026-10-07). Assert
          # ELF so a blocked postinstall fails here, loudly, instead.
          bin="$(readlink -f "$(command -v workerd)")"
          if ! head -c 4 "$bin" | od -An -tx1 | grep -q "7f 45 4c 46"; then
            echo "::error::workerd at $bin is the Node launcher, not the native ELF (postinstall blocked) — the suite would fail with undefined kernel calls"
            exit 1
          fi
      - name: client + gatekeeper pair e2e (submit → approve/reject → merged result, + deny)
        working-directory: unfer
        run: >
          cargo test --locked --manifest-path ../australVM/safestos/cranelift/Cargo.toml
          --features ecmascript --test ecmascript_module -- --nocapture

  durable-status-e2e:
    name: durable_status_module end-to-end (Austral CPS-JIT + UK-4001)
    runs-on: ubuntu-latest
    steps:
      - name: checkout unfer (sibling layout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
