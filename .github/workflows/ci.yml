name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # CPU-only: the `cuda` feature is never enabled in CI. All acceptance
  # criteria in docs/IMPLEMENTATION_PLAN.md run on CPU.

jobs:
  # ---------------------------------------------------------------------------
  # H1 (PLAN_HARNESS): maintenance-invariant gate. Turns the AGENTS.md
  # maintenance checklist into machine-checkable invariants. Passes on a clean
  # tree with the toolchain present, fails on a deliberately introduced
  # violation.
  #
  # Toolchain is required, not optional: smoke_gate builds libunfer_ffi.so and
  # the H11 coverage gate runs the unit harness under -C instrument-coverage,
  # so the job installs stable + llvm-tools-preview. Without the toolchain the
  # gates would print [gap] (tooling absent) and never actually enforce — the
  # job would be green while the checks it claims to run did nothing.
  # ---------------------------------------------------------------------------
  verify-invariants:
    name: maintenance invariants (H1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
      # unfer_consensus path-deps ../../dynamic-arctic; default checkout puts
      # the repo at $GITHUB_WORKSPACE, so the sibling must sit one level up.
      - name: checkout dynamic-arctic as sibling (unfer_consensus path dep)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/dynamic-arctic.git ../dynamic-arctic
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # dtolnay/rust-toolchain@stable
      - name: install LLVM coverage tools (H11 per-file coverage gate)
        run: rustup component add llvm-tools-preview
      - name: run scripts/verify-invariants
        run: bash scripts/verify-invariants

  # ---------------------------------------------------------------------------
  # X1/X5 hygiene gates. Cheap, and they catch the class of drift that is
  # invisible in review: a generated file committed before its ignore rule
  # existed, and the shared LaTeX corpus diverging between the two repos that
  # hold a copy.
  #
  # timepiece is checked out as a sibling because `scripts/check-book-sync`
  # needs both sides to compare. It is the source of record for book.tex and
  # ODE.tex; unfer/ carries a synced copy because its tests read it by that path.
  # ---------------------------------------------------------------------------
  hygiene-gates:
    name: artifact + corpus drift gates (X1/X5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
      - name: checkout timepiece as sibling (shared LaTeX source of record)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/timepiece.git ../timepiece
      - name: no tracked build artifacts (X5)
        run: bash scripts/tree-size
      - name: book.tex / ODE.tex in sync (X1)
        run: bash scripts/check-book-sync
      - name: status blocks present and sane (X2)
        run: bash scripts/check-status

  # ---------------------------------------------------------------------------
  # X7: cross-repo integration.
  #
  # Every repo in this workspace passes its own CI against its own checkout, and
  # three of them depend on a *sibling's* working tree: unfer path-deps
  # dynamic-arctic and velysterm. A change in one that breaks another is
  # invisible until someone runs the pair locally, which is exactly the failure
  # mode a path dependency invites.
  #
  # Each repo runs as its own step with `if: always()` so nothing is skipped by
  # an earlier failure, and a final step reports which repo broke which by name.
  # That summary is the acceptance criterion: a deliberate break in prob_kernel
  # has to show up as a *named* failure, not a red blob.
  #
  # The commands are the ones each README's Verification section documents, so
  # there is one answer to "how do I check this repo" rather than two.
  # ---------------------------------------------------------------------------
  cross-repo:
    name: cross-repo integration (X7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # Swatinem/rust-cache@v2

      - name: checkout siblings at their default branch
        run: |
          git clone --depth 1 https://github.com/leonardopedro/dynamic-arctic.git ../dynamic-arctic
          git clone --depth 1 https://github.com/leonardopedro/velysterm.git ../velysterm

      # velysterm's document crates are Bevy-free but not dependency-free:
      # winit/xkbcommon and the X/wayland client libs are found through
      # pkg-config. Installing them explicitly is the difference between a gate
      # that tests the workspace and one that reliably reports a missing -l flags.
      - name: system deps for the velysterm crates
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb1-dev libxcb-shm0-dev libxcb-render0-dev

      # Layout note, because it is load-bearing and invisible: the siblings land
      # in $GITHUB_WORKSPACE/../<repo>, which is what makes velysterm's
      # `../../../unfer` path dependency resolve back to this checkout. That works
      # because Actions checks out into a directory named after the repo. Moving
      # the clones elsewhere would break the path dep with a confusing error, so
      # the paths above are deliberate.
      #
      # The coupling this job exists to catch is real in both directions:
      # unfer_consensus path-deps dynamic-arctic, and mathed_mini path-deps
      # unfer_ffi and unfer_protocol. A green unfer run says nothing about
      # whether either sibling still fits.

      # The path-dependency hazard, called out explicitly: this job exists because
      # `unfer_consensus` and `mathed_core` compile against a sibling checkout, so
      # unfer's own green run says nothing about whether the sibling still fits.
      - name: unfer (kernel + dynamic-arctic path dep)
        id: unfer
        run: cargo build --workspace

      - name: dynamic-arctic (threshold authority)
        id: arctic
        run: |
          cargo build --manifest-path ../dynamic-arctic/Cargo.toml --no-default-features
          cargo test  --manifest-path ../dynamic-arctic/Cargo.toml --no-default-features

      - name: velysterm (document engine emthin path-deps)
        id: velysterm
        run: |
          cargo test --manifest-path ../velysterm/Cargo.toml \
            -p mathed_core -p mathed_mini

      # `if: always()`: one broken repo must not hide the state of the others.
      - name: report which repo broke which
        if: always()
        run: |
          # Each step records a conclusion either way, so this step runs even when
          # the steps above were skipped by an earlier failure.
          failed=""
          for step in unfer arctic velysterm; do
            if [ "${{ steps.$step.outcome }}" = "success" ]; then
              echo "  PASS  $step"
            else
              echo "  FAIL  $step (${{ steps.$step.outcome }})"
              failed="$failed $step"
            fi
          done
          if [ -n "$failed" ]; then
            echo
            echo "cross-repo: broken repo(s):$failed"
            echo "  A dynamic-arctic failure here is usually an API drift in the"
            echo "  threshold signatures that unfer_consensus depends on."
            echo "  A velysterm failure here is usually a document-model change"
            echo "  that emthin and unfer both consume."
            exit 1
          fi
          echo "cross-repo: all sibling repos verified"

  # ---------------------------------------------------------------------------
  # Core: the unfer kernel workspace must build, lint and test on CPU.
  # This locks in the per-crate baselines recorded in IMPLEMENTATION_PLAN.md.
  # ---------------------------------------------------------------------------
  test:
    name: workspace test (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
      # unfer_consensus path-deps ../../dynamic-arctic; default checkout puts
      # the repo at $GITHUB_WORKSPACE, so the sibling must sit one level up.
      - name: checkout dynamic-arctic as sibling (unfer_consensus path dep)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/dynamic-arctic.git ../dynamic-arctic
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # Swatinem/rust-cache@v2
      - name: cargo build
        run: cargo build --workspace --release --verbose
      # Heavy tests run in release mode (per policy) with the numerically
      # optimized profile (lto=thin, codegen-units=1). Debug mode is reserved
      # for the fast unit suites; the physics/SIRK suites are release-only.
      - name: cargo test (release)
        run: cargo test --workspace --release --verbose
      # The heavy nested_fock_algebra physics unit tests (e.g. the quartic QYM
      # builder) are #[ignore]d so the debug default suite stays fast; they run
      # here in release via --ignored (0.01s each) — same mode as
      # scripts/run_heavy_tests.sh.
      - name: heavy physics unit tests (release, ignored)
        run: cargo test -p nested_fock_algebra --release --lib -- --ignored
      # F23 (S24): the release manifest is byte-addressed and pinned; a wrong byte in
      # any module changes the manifest and fails this explicit golden gate. Regenerate a
      # deliberately-changed manifest only with UPDATE_GOLDEN=1 (never in CI).
      - name: release manifest golden gate (F23)
        run: cargo test -p unfer_data --test release_manifest_golden

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
      # unfer_consensus path-deps ../../dynamic-arctic; default checkout puts
      # the repo at $GITHUB_WORKSPACE, so the sibling must sit one level up.
      - name: checkout dynamic-arctic as sibling (unfer_consensus path dep)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/dynamic-arctic.git ../dynamic-arctic
      # Explicit 1.97.1: rust-toolchain.toml overrides the toolchain the action
      # installs, so without the explicit pin the rustfmt/clippy components land
      # on the action's own (newer) stable and the pinned toolchain lacks them.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Feature-gated jobs: the default-features matrix never compiles the
  # `network`/`audit`/`zenodo`/`latex` surfaces, so their gated tests (9 zenodo,
  # 14 audit console, latex CAS, QuePaxa network) never ran in CI. This job
  # exercises each feature's test suite. The `cuda` surface is covered by the
  # self-hosted `qfm-tomo-e2e-cuda` job (needs a CUDA toolkit + GPU, unavailable
  # on public runners).
  # ---------------------------------------------------------------------------
  gated-features:
    name: feature-gated tests (network/audit/zenodo/latex)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
      # unfer_consensus path-deps ../../dynamic-arctic; default checkout puts
      # the repo at $GITHUB_WORKSPACE, so the sibling must sit one level up.
      - name: checkout dynamic-arctic as sibling (unfer_consensus path dep)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/dynamic-arctic.git ../dynamic-arctic
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # Swatinem/rust-cache@v2
      - name: unfer_edge audit console tests
        run: cargo test -p unfer_edge --features audit
      - name: unfer_ffi zenodo store tests
        run: cargo test -p unfer_ffi --features zenodo
      - name: nested_fock_algebra latex CAS tests
        run: cargo test -p nested_fock_algebra --features latex
      - name: prob_kernel latex tests
        run: cargo test -p prob_kernel --features latex
      - name: unfer_ffi latex tests
        run: cargo test -p unfer_ffi --features latex
      - name: unfer_consensus QuePaxa network tests
        run: cargo test -p unfer_consensus --features network
      - name: unfer_taler network testnet tests
        run: cargo test -p unfer_taler --features network

  # ---------------------------------------------------------------------------
  # Integration spine: build the FFI as a shared lib and assert the uk_* C ABI
  # symbols are exported (the contract the australVM JIT links against).
  # ---------------------------------------------------------------------------
  ffi-symbols:
    name: unfer_ffi C ABI symbols
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
      # unfer_consensus path-deps ../../dynamic-arctic; default checkout puts
      # the repo at $GITHUB_WORKSPACE, so the sibling must sit one level up.
      - name: checkout dynamic-arctic as sibling (unfer_consensus path dep)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/dynamic-arctic.git ../dynamic-arctic
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # Swatinem/rust-cache@v2
      - run: cargo build --release -p unfer_ffi
      - name: assert generated census matches SYMBOL_REGISTRY (H2)
        run: |
          python3 scripts/gen_symbol_artifacts check || { echo "FAIL: run scripts/gen_symbol_artifacts"; exit 1; }
      - name: assert uk_* symbols match EXPECTED_SYMBOLS.txt (generated census)
        run: |
          nm -D --defined-only target/release/libunfer_ffi.so \
            | awk '/ T uk_/ {print $3}' | sort > /tmp/got_uk.txt
          if ! diff -u unfer_ffi/EXPECTED_SYMBOLS.txt /tmp/got_uk.txt; then
            echo "FAIL: uk_* symbols mismatch (see diff above)." >&2
            echo "If you added/removed a uk_* symbol, add it to unfer_protocol::symbols and run scripts/gen_symbol_artifacts." >&2
            exit 1
          fi
          echo "All $(wc -l < unfer_ffi/EXPECTED_SYMBOLS.txt) uk_* symbols match EXPECTED_SYMBOLS.txt."
      - run: cargo build --release -p unfer_ffi --features zenodo
      - name: assert 5 uz_* symbols match EXPECTED_SYMBOLS_ZENODO.txt (zenodo feature)
        run: |
          nm -D --defined-only target/release/libunfer_ffi.so \
            | awk '/ T uz_/ {print $3}' | sort > /tmp/got_uz.txt
          if ! diff -u unfer_ffi/EXPECTED_SYMBOLS_ZENODO.txt /tmp/got_uz.txt; then
            echo "FAIL: uz_* symbols mismatch (see diff above)." >&2
            echo "If you added/removed a uz_* symbol, update unfer_ffi/EXPECTED_SYMBOLS_ZENODO.txt." >&2
            exit 1
          fi
          echo "All 5 uz_* symbols match EXPECTED_SYMBOLS_ZENODO.txt."

  # ---------------------------------------------------------------------------
  # End-to-end demo gate (the architecture's central claim): an Austral module
  # JIT-compiled by australVM/safestos calls the unfer kernel in-process, and
  # the manifest auth gate denies a revoked grant (UK-4001).
  #
  # Requires the sibling australVM checkout + the OCaml/dune toolchain. If the
  # australVM repo is private, add a PAT secret and set `token:` on its checkout.
  # Layout matters: run_demo.sh expects $ROOT/{unfer,australVM}.
  # ---------------------------------------------------------------------------
  demo-e2e:
    name: demo_module end-to-end (Austral JIT + UK-4001)
    runs-on: ubuntu-latest
    steps:
      - name: checkout unfer (sibling layout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          path: unfer
      - name: checkout australVM (sibling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          repository: leonardopedro/australVM
          path: australVM
          # P9 P13: PAT support for private repos. If australVM is
          # private, set the AUSTRALVM_TOKEN secret (Settings →
          # Secrets → New repository secret, scope: this repo) and
          # uncomment the next line. The job still works for the
          # public repo without the token (GitHub's GITHUB_TOKEN
          # doesn't have access to sibling private repos).
          # token: ${{ secrets.AUSTRALVM_TOKEN }}
      - name: checkout dynamic-arctic (sibling path dep, unfer_consensus)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          repository: leonardopedro/dynamic-arctic
          # Explicit path: without it the checkout targets (and cleans) the
          # workspace root, wiping the unfer/australVM sibling checkouts.
          path: dynamic-arctic
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # Swatinem/rust-cache@v2
        with:
          workspaces: |
            unfer
            australVM/safestos/cranelift
      - uses: ocaml/setup-ocaml@e89b2ded52a6e13f50162220cf5fe47290162032  # ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.13"
      - name: install australVM OCaml deps
        working-directory: australVM
        run: opam install . --deps-only --yes || true
      - name: run end-to-end demo (via module_builder)
        working-directory: unfer
        run: bash tools/module_builder run demo_module

  # ---------------------------------------------------------------------------
  # All remaining e2e module tests use the module_builder, sharing the same
  # repeated setup steps (checkout, cache, deps) as demo-e2e.
  # ---------------------------------------------------------------------------
  qfm-e2e:
    name: qfm_module end-to-end (QFM Austral JIT + UK-4001)
    runs-on: ubuntu-latest
    steps:
      - name: checkout unfer (sibling layout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          path: unfer
      - name: checkout australVM (sibling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          repository: leonardopedro/australVM
          path: australVM
      - name: checkout dynamic-arctic (sibling path dep, unfer_consensus)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          repository: leonardopedro/dynamic-arctic
          # Explicit path: without it the checkout targets (and cleans) the
          # workspace root, wiping the unfer/australVM sibling checkouts.
          path: dynamic-arctic
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # Swatinem/rust-cache@v2
        with:
          workspaces: |
            unfer
            australVM/safestos/cranelift
      - uses: ocaml/setup-ocaml@e89b2ded52a6e13f50162220cf5fe47290162032  # ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.13"
      - name: install australVM OCaml deps
        working-directory: australVM
        run: opam install . --deps-only --yes || true
      - name: run qfm_module (via module_builder)
        working-directory: unfer
        run: bash tools/module_builder run qfm_module

  qfm-tomo-e2e:
    name: qfm_tomo_module end-to-end (QFM-TSR Austral JIT + UK-4001)
    runs-on: ubuntu-latest
    steps:
      - name: checkout unfer (sibling layout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          path: unfer
      - name: checkout australVM (sibling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          repository: leonardopedro/australVM
          path: australVM
      - name: checkout dynamic-arctic (sibling path dep, unfer_consensus)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          repository: leonardopedro/dynamic-arctic
          # Explicit path: without it the checkout targets (and cleans) the
          # workspace root, wiping the unfer/australVM sibling checkouts.
          path: dynamic-arctic
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # Swatinem/rust-cache@v2
        with:
          workspaces: |
            unfer
            australVM/safestos/cranelift
      - uses: ocaml/setup-ocaml@e89b2ded52a6e13f50162220cf5fe47290162032  # ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.13"
      - name: install australVM OCaml deps
        working-directory: australVM
        run: opam install . --deps-only --yes || true
      - name: run qfm_tomo_module (via module_builder)
        working-directory: unfer
        run: bash tools/module_builder run qfm_tomo_module

  bayes-update-e2e:
    name: bayes_update_module end-to-end (Quantum Bayesian Update + UK-4001)
    runs-on: ubuntu-latest
    steps:
      - name: checkout unfer (sibling layout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          path: unfer
      - name: checkout australVM (sibling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          repository: leonardopedro/australVM
          path: australVM
      - name: checkout dynamic-arctic (sibling path dep, unfer_consensus)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          repository: leonardopedro/dynamic-arctic
          # Explicit path: without it the checkout targets (and cleans) the
          # workspace root, wiping the unfer/australVM sibling checkouts.
          path: dynamic-arctic
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # Swatinem/rust-cache@v2
        with:
          workspaces: |
            unfer
            australVM/safestos/cranelift
      - uses: ocaml/setup-ocaml@e89b2ded52a6e13f50162220cf5fe47290162032  # ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.13"
      - name: install australVM OCaml deps
        working-directory: australVM
        run: opam install . --deps-only --yes || true
      - name: run bayes_update_module (via module_builder)
        working-directory: unfer
        run: bash tools/module_builder run bayes_update_module

  iterated-bayes-e2e:
    name: iterated_bayes_module end-to-end (Iterated Bayes + SIRK + UK-4001)
    runs-on: ubuntu-latest
    steps:
      - name: checkout unfer (sibling layout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          path: unfer
      - name: checkout australVM (sibling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          repository: leonardopedro/australVM
          path: australVM
      - name: checkout dynamic-arctic (sibling path dep, unfer_consensus)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          repository: leonardopedro/dynamic-arctic
          # Explicit path: without it the checkout targets (and cleans) the
          # workspace root, wiping the unfer/australVM sibling checkouts.
          path: dynamic-arctic
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # Swatinem/rust-cache@v2
        with:
          workspaces: |
            unfer
            australVM/safestos/cranelift
      - uses: ocaml/setup-ocaml@e89b2ded52a6e13f50162220cf5fe47290162032  # ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.13"
      - name: install australVM OCaml deps
        working-directory: australVM
        run: opam install . --deps-only --yes || true
      - name: run iterated_bayes_module (via module_builder)
        working-directory: unfer
        run: bash tools/module_builder run iterated_bayes_module

  # ---------------------------------------------------------------------------
  # Zenodo store module gate: type-check + authorization test.
  # The full JIT-execution positive test is blocked by a pre-existing CPS-JIT
  # crash (tracks Plan B / australVM issue). Type-check passes cleanly.
  # ---------------------------------------------------------------------------
  zenodo-e2e:
    name: zenodo_store_module type-check + auth gate
    runs-on: ubuntu-latest
    steps:
      - name: checkout unfer (sibling layout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          path: unfer
      - name: checkout australVM (sibling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          repository: leonardopedro/australVM
          path: australVM
      - name: checkout dynamic-arctic (sibling path dep, unfer_consensus)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          repository: leonardopedro/dynamic-arctic
          # Explicit path: without it the checkout targets (and cleans) the
          # workspace root, wiping the unfer/australVM sibling checkouts.
          path: dynamic-arctic
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # Swatinem/rust-cache@v2
        with:
          workspaces: |
            unfer
            australVM/safestos/cranelift
      - uses: ocaml/setup-ocaml@e89b2ded52a6e13f50162220cf5fe47290162032  # ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.13"
      - name: install australVM OCaml deps
        working-directory: australVM
        run: opam install . --deps-only --yes || true
      - name: type-check zenodo_store_module
        working-directory: unfer
        run: bash tools/module_builder tc zenodo_store_module
      - name: auth gate test (uz_push allow + deny)
        working-directory: unfer
        run: |
          MODHOST="../australVM/safestos/cranelift/target/release/modhost"
          # Allow: full manifest grants uz_push
          $MODHOST authorize zenodo_store_module/module.toml zenodo_store_module uz_push
          # Deny: strip uz_push → UK-4001
          STRIPPED=$(mktemp)
          trap 'rm -f "$STRIPPED"' EXIT
          grep -v uz_push zenodo_store_module/module.toml > "$STRIPPED"
          if $MODHOST authorize "$STRIPPED" zenodo_store_module uz_push 2>/dev/null; then
            echo "FAIL: stripped manifest must DENY uz_push" >&2; exit 1
          fi
          echo "PASS: auth gate enforces uz_push grant"

  # ---------------------------------------------------------------------------
  # CUDA-on-CI: GPU smoke for the SIRK solver. The 14 CUDA tests in
  # fock_sirk/src/forward_sirk.rs are smoke-tested locally but not in CI.
  # CUDA smoke: runs only when a self-hosted runner with the `gpu` label is
  # registered AND the RUN_CUDA_SMOKE repository variable is set to `true`
  # (Settings → Secrets and variables → Actions → Variables). Without the
  # variable the job is *skipped*, so runs complete — a bare runner-gated job
  # would sit in `queued` forever and hold every CI run hostage. Mirrors
  # qfm-tomo-e2e but enables the `cuda` feature for fock_sirk.
  # ---------------------------------------------------------------------------
  qfm-tomo-e2e-cuda:
    if: vars.RUN_CUDA_SMOKE == 'true'
    name: fock_sirk CUDA smoke (self-hosted GPU)
    runs-on: [self-hosted, gpu]
    steps:
      - name: checkout unfer (sibling layout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          path: unfer
      # unfer is at $GITHUB_WORKSPACE/unfer (path layout), so the
      # ../../dynamic-arctic path dep resolves to $GITHUB_WORKSPACE/dynamic-arctic.
      - name: checkout dynamic-arctic (sibling path dep, unfer_consensus)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          repository: leonardopedro/dynamic-arctic
          # Explicit path: without it the checkout targets (and cleans) the
          # workspace root, wiping the unfer/australVM sibling checkouts.
          path: dynamic-arctic
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # Swatinem/rust-cache@v2
        with:
          workspaces: |
            unfer
      - name: print GPU info
        run: |
          nvidia-smi
      - name: cargo test (cuda)
        working-directory: unfer
        # On systems with CUDA 12.2 toolkit + CUDA 13 driver coexistence
        # the runtime resolves to /lib/x86_64-linux-gnu; AGENTS.md §5
        # records the LD_LIBRARY_PATH requirement.
        env:
          LD_LIBRARY_PATH: /lib/x86_64-linux-gnu:/usr/lib/x86_64-linux-gnu
        run: cargo test -p fock_sirk --features cuda -- --nocapture
