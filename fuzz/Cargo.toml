[package]
name = "unfer_protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# C4: fuzz target for the normalized ingest message.
#
# This crate is NOT part of the workspace and is not built by `cargo test`. It is
# built by `cargo fuzz`, which needs nightly and libfuzzer-sys.
#
# **The properties are single-sourced in `unfer_protocol::ingest_props`** (D.1a).
# This target holds no assertions of its own; it calls those same predicates.
# That is what keeps the fuzzer and `ingest::property::arbitrary_json_never_panics`
# from drifting into checking different things — which is how the ingest cap bug
# below survived a 20k-message property test.
#
# What this target adds over that test is *reach*, not rules.
#
# Before 2026-10-05 this crate was unbuildable in ordinary CI (libfuzzer-sys is
# not vendored) and no job ran it, so no document could cite fuzzing as evidence.
# `.github/workflows/fuzz.yml` now runs it on a nightly schedule. Until that job
# has produced at least one green run, the honest status line remains
# "property test in CI; fuzz target unrun".
[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
unfer_protocol = { path = "../unfer_protocol" }
# The target's constructor-reach parse (`serde_json::from_str` after
# `check_raw`) needs serde_json in *this* crate's namespace:
# unfer_protocol depending on it does not make it importable here
# (Rust 2018+). Missing since the target was first written, which is why
# every nightly run in .github/workflows/fuzz.yml red on a *build* error,
# not a finding. Same version the workspace pins (../Cargo.toml).
serde_json = "1.0.150"

[[bin]]
name = "ingest_message"
path = "fuzz_targets/ingest_message.rs"
test = false
doc = false
bench = false
