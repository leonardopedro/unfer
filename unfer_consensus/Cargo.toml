[package]
name = "unfer_consensus"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "QuePaxa-backed consensus layer for the unfer federation protocol."

[features]
default = []
network = ["dep:tokio", "dep:tokio-util", "dep:rust-quepaxa", "rust-quepaxa/network"]

[dependencies]
unfer_protocol = { path = "../unfer_protocol" }
prob_kernel = { path = "../prob_kernel" }
arctic = { path = "../../dynamic-arctic", default-features = false }
curve25519-dalek = { version = "4.1", features = ["rand_core"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
tokio = { version = "1", features = ["full"], optional = true }
tokio-util = { version = "0.7", optional = true }
rust-quepaxa = { version = "0.1", optional = true }

[dev-dependencies]
proptest = { workspace = true }
rcgen = { version = "0.13", features = ["crypto", "ring"], default-features = false }

[[test]]
name = "phase6_testnet"
required-features = ["network"]
