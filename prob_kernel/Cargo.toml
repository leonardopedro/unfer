[package]
name = "prob_kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Born-rule probability layer over the unfer QFT kernel."

[features]
default = []
latex = ["nested_fock_algebra/latex"]
cuda = ["fock_sirk/cuda", "candle-core/cuda"]

[dependencies]
nested_fock_algebra = { path = "../nested_fock_algebra" }
fock_sirk = { path = "../fock_sirk" }
unfer_protocol = { path = "../unfer_protocol" }
ode_sirk = { path = "../ode_sirk" }
qfm = { path = "../qfm" }
num-complex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
candle-core = { workspace = true }
sha2 = "0.10"
hex = "0.4"
# Pinned to the revision Cargo.lock records. Unpinned, every workspace that
# path-deps prob_kernel resolves its own HEAD of this git dependency: velysterm's
# lock (../../velysterm/Cargo.lock) still names an older commit whose
# `nanoda_lib::Config` has no `stack_size_bytes`, so building `unfer_agent`
# against this tree failed with E0560 (`Config` has no field `stack_size_bytes`).
nanoda_lib = { git = "https://github.com/ammkrn/nanoda_lib", rev = "0da9f98feadd3a0a2ef4b3dbcf52a298a6fef929" }
logos = { path = "../logos" }
