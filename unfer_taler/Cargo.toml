[package]
name = "unfer_taler"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GNU Taler-style exchange adapter over the unfer certificate ledger (peg-in/withdraw/deposit/peg-out)."

[dependencies]
unfer_protocol = { path = "../unfer_protocol" }
unfer_consensus = { path = "../unfer_consensus" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"

[dev-dependencies]
proptest = { workspace = true }