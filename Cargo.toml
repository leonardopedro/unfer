[workspace]
resolver = "2"
members = ["sirk_core_model", "fock_sirk", "nested_fock_algebra", "unfer_protocol", "prob_kernel", "unfer_ffi", "qfm", "unfer_edge", "qfm_text", "ode_sirk", "logos", "unfer_consensus", "unfer_identity", "unfer_data", "unfer_taler"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
num-complex = "0.4.6"
nalgebra = "0.34.2"
rayon = "1.12.0"
thiserror = "2.0.18"
anyhow = "1.0.102"
rustc-hash = "2.1.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
candle-core = { version = "0.8.4", default-features = false }
mathhook = "0.2.0"
proptest = "1.5.0"
loro = "1.13.9"

# Numerically optimized release profile. The heavy physics suites
# (scripts/run_heavy_tests.sh, scripts/run_physics_anchor.sh) run with
# `--release`; thin LTO + a single codegen unit give the linear-algebra and
# Fock/SIRK kernels the maximum in-crate optimization, which matters for the
# debug-vs-release performance cliff (a quartic YM unit test that takes
# minutes in debug finishes in <1s here).
[profile.release]
lto = "thin"
codegen-units = 1


